# Pull request descriptions hold only what the maintainer wrote: footers that tools append
# ("Generated by [Tool](url)", session links) are removed when a pull request is opened or
# edited, and from every pull request when run by hand.
name: PR description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

# No workflow-level permissions: the job declares only what it needs.
permissions: {}

concurrency:
  group: pr-description-${{ github.event.pull_request.number || 'all' }}
  cancel-in-progress: false

jobs:
  clean:
    name: Clean description
    # Only this repository's own pull requests: a fork's token can't edit them.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/clean-pr-description.mjs
          sparse-checkout-cone-mode: false
      - run: node scripts/clean-pr-description.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
