name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push version commits and tags
  pull-requests: write # open the release PR
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5. No NPM_TOKEN secret required.
      - run: npm install -g npm@latest
      - run: npm ci
      # With pending changesets: opens/updates a "chore: release" PR.
      # With none (e.g. after merging that PR): publishes any version not yet on npm.
      - name: Release PR or publish
        uses: changesets/action@v2
        with:
          version-script: npx changeset version
          publish-script: npm run release
          commit-message: "chore: release"
          pr-title: "chore: release"
