name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write        # push version commits and tags
  pull-requests: write   # open the "Version Packages" PR
  id-token: write        # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5. No NPM_TOKEN secret required.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npm run release
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
