# Daily dependency health, without bot pull requests: every commit in this repository
# is the maintainer's own, who updates by hand. A scheduled failure opens an issue (an email
# alone went unseen for six days), and the next passing run closes it.
name: Dependency audit

on:
  schedule:
    - cron: "23 2 * * *"
  pull_request:
    paths: [package.json, package-lock.json, 'compat/**', docs/package.json, docs/package-lock.json, 'examples/starter/package*.json', .github/workflows/audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Vulnerabilities and signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix compat/react18
      - run: npm ci --ignore-scripts --prefix compat/typescript5
      - run: npm ci --ignore-scripts --prefix compat/typescript7
      - run: npm ci --ignore-scripts --prefix docs
      - run: npm ci --ignore-scripts --prefix examples/starter
      # Any known vulnerability, in runtime or development dependencies, fails the job.
      - run: npm audit --audit-level=low
      - run: npm audit --audit-level=low --prefix compat/react18
      - run: npm audit --audit-level=low --prefix compat/typescript5
      - run: npm audit --audit-level=low --prefix compat/typescript7
      - run: npm audit --audit-level=low --prefix docs
      - run: npm audit --audit-level=low --prefix examples/starter
      # Every installed package matches the registry's signature, and attestations verify.
      - run: npm audit signatures
      - run: npm audit signatures --prefix compat/react18
      - run: npm audit signatures --prefix compat/typescript5
      - run: npm audit signatures --prefix compat/typescript7
      - run: npm audit signatures --prefix docs
      - run: npm audit signatures --prefix examples/starter
      - name: Outdated dependencies (report only)
        run: |
          {
            echo "## Outdated dependencies"
            echo
            echo '```'
            npm outdated || true
            npm outdated --prefix compat/react18 || true
            npm outdated --prefix compat/typescript5 || true
            npm outdated --prefix compat/typescript7 || true
            npm outdated --prefix docs || true
            npm outdated --prefix examples/starter || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Makes a scheduled result visible where the maintainer looks: one open issue while the audit
  # fails (a comment per further failing day), closed by the next run that passes.
  report:
    name: Report on the repository
    needs: audit
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.audit.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Dependency audit is failing"
          OPEN=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ "$RESULT" = "success" ]; then
            if [ -n "$OPEN" ]; then gh issue close "$OPEN" --comment "The audit passes again: $RUN_URL"; fi
          elif [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Still failing ($RESULT): $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The daily dependency audit failed ($RESULT): a known vulnerability, a bad signature, or the audit itself. Details: $RUN_URL

          This issue closes itself when the audit passes again."
          fi

