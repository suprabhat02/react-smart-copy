name: Docs site

on:
  push:
    branches: [main]
  # Rebuild after every release so the version history shows the new
  # version's npm publish date as soon as it is live.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# No workflow-level permissions: each job declares only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The demo runs on the real library, built from this exact commit.
      - run: npm run site:build
      # Smoke-test: fail fast if the build produced an empty or missing site.
      - name: Verify site artifact is non-empty
        run: |
          for f in index.html styles.css site.js demos.js lib.js core.js capture.js changelog.json og.png; do
            test -s "site/$f" || { echo "site/$f is missing or empty"; exit 1; }
          done
          wc -c < site/index.html | awk '{ if ($1 < 10000) { print "site/index.html is suspiciously small (" $1 " bytes)"; exit 1 } }'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
