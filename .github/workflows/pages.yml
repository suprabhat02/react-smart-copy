name: Docs site

on:
  push:
    branches: [main]
  # Rebuild after every release so the version history shows the new
  # version's npm publish date as soon as it is live.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# No workflow-level permissions: each job declares only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The full history: each page shows when its source last changed.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - run: npm ci
      - run: npm run docs:install
      # The demos run on the real library, built from this exact commit; the Releases page
      # comes from CHANGELOG.md, with npm publish dates.
      - run: npm run docs:build
      # Smoke-test: fail fast if the build produced an empty or partial site.
      - name: Verify the built docs
        working-directory: docs/dist
        run: |
          for f in index.html 404.html favicon.svg og.png sitemap-index.xml pagefind/pagefind.js \
            start/introduction/index.html copy/use-copy/index.html modules/rich-text/index.html project/releases/index.html; do
            test -s "$f" || { echo "docs/dist/$f is missing or empty"; exit 1; }
          done
          pages=$(find . -name index.html -not -path './pagefind/*' | wc -l)
          test "$pages" -ge 30 || { echo "only $pages pages were built"; exit 1; }
          # Every page carries its Content Security Policy.
          missing=$(grep -L 'http-equiv="Content-Security-Policy"' $(find . -name '*.html') || true)
          test -z "$missing" || { echo "pages without a CSP: $missing"; exit 1; }
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
