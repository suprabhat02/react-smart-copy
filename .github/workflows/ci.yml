name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal read-only permissions for the whole workflow; no job needs more.
permissions:
  contents: read

jobs:
  authorship:
    name: Authorship
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR's own commits, not GitHub's test merge of it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: scripts/check-authorship.sh HEAD

  verify:
    name: Lint, types, tests, build, package, size
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Exactly what release.yml runs before publishing, on the same Node: an npm too old to
  # publish, or a test that passes on Node 22 but not on Node 24, fails here, not at release.
  release-toolchain:
    name: Release toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-npm-version.js 11.5.1
      - run: npm ci
      - run: npm run verify

  # React 19 is in the lockfile; React 18 comes from compat/react18 and its own lockfile.
  # No job installs unpinned versions.
  react-compat:
    name: Tests on React ${{ matrix.react }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    env:
      REACT_VERSION: ${{ matrix.react }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            compat/react18/package-lock.json
      - run: npm ci
      - if: matrix.react == 18
        run: npm ci --prefix compat/react18 --ignore-scripts
      - if: matrix.react == 18
        run: npx tsc -p tsconfig.react18.json
      - if: matrix.react == 19
        run: npm run typecheck
      # test/react-version.test.ts fails unless the suite really runs on REACT_VERSION.
      - run: npm test

  # Users compile our declarations with whatever TypeScript they have: check the oldest supported
  # version (5.0) and the newest major (7). Each comes from compat/typescriptN and its own lockfile.
  typescript:
    name: Types on TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - typescript: '5.0'
            compat: typescript5
          - typescript: '7'
            compat: typescript7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            compat/${{ matrix.compat }}/package-lock.json
      - run: npm ci
      - run: npm ci --prefix compat/${{ matrix.compat }} --ignore-scripts
      # Build with the project's TypeScript (the declaration bundler uses its API), then check.
      - run: npm run build
      - run: compat/${{ matrix.compat }}/node_modules/.bin/tsc --version
      # The project itself on the newest major; consumers of the published declarations on both.
      - if: matrix.compat == 'typescript7'
        run: compat/typescript7/node_modules/.bin/tsc --noEmit
      - run: compat/${{ matrix.compat }}/node_modules/.bin/tsc -p consumer/tsconfig.bundler.json
      - run: compat/${{ matrix.compat }}/node_modules/.bin/tsc -p consumer/tsconfig.nodenext.json

  # The packed package on every Node.js it supports (engines: >=18): each entry point through
  # import and require, its pure functions, and typed errors where a DOM is needed.
  node:
    name: Runs on Node.js ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The build tools need a current Node.js; the package is then run on the one under test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: scripts/smoke-node.sh

  # ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19. Jobs are pinned to 24.04;
  # this job shows when the new image is safe to move to. It does not block merges.
  ubuntu-next:
    name: Verify on Ubuntu 26.04 (preview)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  # The library in real browser engines (Chromium, Firefox, WebKit), through the built docs: every
  # page passes axe in both themes, and every live demo runs on the built package.
  browsers:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - run: npm ci
      - run: npm run docs:install
      - run: npm run docs:build
      # The browser download or its system packages can stall on the runner's mirrors: each try
      # is cut off after 5 minutes, and tried up to 3 times, instead of using up the job.
      - name: Install ${{ matrix.browser }}
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=30 300 npx playwright install --with-deps "$BROWSER" && exit 0
            echo "::warning::Installing $BROWSER failed or stalled (attempt $attempt of 3)."
            # A try cut off mid-install can leave apt or dpkg running, holding their locks.
            sudo pkill -9 -f '^/usr/bin/(apt-get|dpkg)' || true
            sudo dpkg --configure -a || true
          done
          exit 1
        env:
          BROWSER: ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      # Nothing may pass by not running: every test ran, none was skipped or flaky.
      - name: Check that every test ran
        run: node e2e/check-report.js test-results/e2e.json 149
