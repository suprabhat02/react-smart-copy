name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal read-only permissions for the whole workflow; no job needs more.
permissions:
  contents: read

jobs:
  authorship:
    name: Authorship
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR's own commits, not GitHub's test merge of it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: scripts/check-authorship.sh HEAD

  verify:
    name: Lint, types, tests, build, package, size
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Exactly what release.yml runs before publishing, on the same Node: an npm too old to
  # publish, or a test that passes on Node 22 but not on Node 24, fails here, not at release.
  release-toolchain:
    name: Release toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-npm-version.js 11.5.1
      - run: npm ci
      - run: npm run verify

  # React 19 is in the lockfile; React 18 comes from compat/react18 and its own lockfile.
  # No job installs unpinned versions.
  react-compat:
    name: Tests on React ${{ matrix.react }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    env:
      REACT_VERSION: ${{ matrix.react }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            compat/react18/package-lock.json
      - run: npm ci
      - if: matrix.react == 18
        run: npm ci --prefix compat/react18 --ignore-scripts
      - if: matrix.react == 18
        run: npx tsc -p tsconfig.react18.json
      - if: matrix.react == 19
        run: npm run typecheck
      # test/react-version.test.ts fails unless the suite really runs on REACT_VERSION.
      - run: npm test

  # Users compile our declarations with whatever TypeScript they have: check the newest major too.
  # TypeScript 7 comes from compat/typescript7 and its own lockfile.
  typescript-next:
    name: Types on TypeScript 7
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            compat/typescript7/package-lock.json
      - run: npm ci
      - run: npm ci --prefix compat/typescript7 --ignore-scripts
      # Build with the project's TypeScript (the declaration bundler uses its API), then check with 7.
      - run: npm run build
      - run: compat/typescript7/node_modules/.bin/tsc --version
      - run: compat/typescript7/node_modules/.bin/tsc --noEmit
      - run: compat/typescript7/node_modules/.bin/tsc -p consumer/tsconfig.bundler.json
      - run: compat/typescript7/node_modules/.bin/tsc -p consumer/tsconfig.nodenext.json

  # ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19. Jobs are pinned to 24.04;
  # this job shows when the new image is safe to move to. It does not block merges.
  ubuntu-next:
    name: Verify on Ubuntu 26.04 (preview)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  # The library in real browser engines (Chromium, Firefox, WebKit), through the built docs site.
  browsers:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      # Nothing may pass by not running: every test ran, none was skipped or flaky.
      - name: Check that every test ran
        run: node e2e/check-report.js test-results/e2e.json 38
